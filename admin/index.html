<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | Deva Medical Center</title>
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
    <main class="admin-shell">
        <section class="admin-card" aria-labelledby="admin-title">
            <p class="eyebrow">Deva Medical Center</p>
            <h1 id="admin-title">Admin sign in</h1>
            <p class="intro">Access the private administration area.</p>
            <form id="login-form">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">Sign in</button>
                <p id="message" class="message" role="alert" aria-live="polite"></p>
            </form>
            <div id="dashboard" hidden>
                <p class="status">You are signed in.</p>
                <p>Admin tools can be added here once their data sources are connected.</p>
                <button id="logout" class="secondary" type="button">Sign out</button>
            </div>
        </section>
    </main>
    <script src="/admin/admin.js"></script>
</body>
</html>
